<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus · 工作</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --line:#ececef; --soft:#f3f3f5;
  --text:#18181b; --sub:#63636e; --mute:#a1a1aa;
  --accent:#5b5bd6; --accent-soft:#f0f0fd;
  --amber:#d97706; --amber-soft:#fef6e7;
  --rose:#e5484d;  --rose-soft:#fdeeee;
  --blue:#3e63dd;  --blue-soft:#edf2fe;
  --green:#30a46c; --green-soft:#e9f7ef;
  --gray:#8b8d98;  --gray-soft:#f1f1f3;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font:14px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:72px 380px 1fr;height:100vh}
.app>*{min-height:0}

/* ---------- 导航 ---------- */
.rail{display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:6px;border-right:1px solid var(--line);background:var(--panel)}
.logo{width:34px;height:34px;border-radius:10px;background:var(--text);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;margin-bottom:18px}
.nav{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--mute);position:relative;transition:.15s}
.nav svg{width:21px;height:21px}
.nav:hover{background:var(--soft);color:var(--sub)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.nav .dot{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 2px #fff}
.nav[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:52px;background:var(--text);color:#fff;font-size:12px;padding:3px 8px;border-radius:6px;white-space:nowrap;z-index:9}
.rail .grow{flex:1}

/* ---------- 列表 ---------- */
.list{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line)}
.lh{padding:26px 24px 14px}
.lh h1{font-size:22px;font-weight:650;letter-spacing:-.01em}
.lh .hello{color:var(--sub);font-size:13px;margin-top:4px}
.lh .hello b{color:var(--text);font-weight:600}
.search{margin-top:16px;display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:0 12px;color:var(--mute)}
.search input{flex:1;border:0;background:none;outline:none;font:inherit;padding:9px 0;color:var(--text)}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px 24px 12px}
.seg button{padding:4px 10px;border-radius:999px;font-size:13px;color:var(--sub);white-space:nowrap;transition:.15s}
.seg button:hover{background:var(--soft)}
.seg button.on{background:var(--text);color:#fff}
.seg button span{opacity:.55;margin-left:3px}
.rows{flex:1;overflow:auto;padding:0 12px 24px}
.gl{font-size:12px;color:var(--mute);padding:16px 12px 6px}
.row{display:flex;gap:12px;padding:12px;border-radius:12px;cursor:pointer;transition:.15s}
.row:hover{background:var(--soft)}
.row.sel{background:var(--accent-soft)}
.sd{width:8px;height:8px;border-radius:50%;margin-top:7px;flex-shrink:0;background:var(--c)}
.row .m{flex:1;min-width:0}
.row .t{display:flex;gap:8px}
.row .tt{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tm{font-size:12px;color:var(--mute)}
.row .nx{font-size:13px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 状态 ---------- */
.s-action{--c:var(--amber);--cs:var(--amber-soft)}
.s-blocked{--c:var(--rose);--cs:var(--rose-soft)}
.s-running{--c:var(--blue);--cs:var(--blue-soft)}
.s-done{--c:var(--green);--cs:var(--green-soft)}
.s-ended{--c:var(--gray);--cs:var(--gray-soft)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--cs);color:var(--c);font-size:12.5px;font-weight:600}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.chip.fix{--c:var(--rose);--cs:var(--rose-soft)}

/* ---------- 详情（统一模板） ---------- */
.detail{overflow:auto}
.dw{max-width:860px;margin:0 auto;padding:40px 48px 80px}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px}
.top .sp{flex:1}
.ib{height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--sub);font-size:13px;transition:.15s}
.ib:hover{border-color:#dcdce0;color:var(--text)}
h2{font-size:28px;font-weight:650;letter-spacing:-.02em;line-height:1.3;margin:14px 0 10px}
.why{color:var(--sub);font-size:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;margin-top:28px;padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:18px}
.ring{width:88px;height:88px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center}
.ring b{width:72px;height:72px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;font-weight:650;line-height:1.1}
.ring b small{font-size:11px;color:var(--mute);font-weight:400;margin-top:3px}
.hero .k{font-size:12px;color:var(--mute);letter-spacing:.04em}
.hero .v{font-size:15px;margin:3px 0 14px}
.hero .v:last-child{margin-bottom:0}

.ask{margin-top:20px;padding:24px 28px;border-radius:18px;background:linear-gradient(180deg,#fffaf0,#fff);border:1px solid #f6e3bd}
.ask .lab{font-size:12px;font-weight:600;color:var(--amber);letter-spacing:.04em}
.ask h3{font-size:17px;font-weight:600;margin:6px 0 4px}
.ask p{color:var(--sub);font-size:13.5px}
.facts{margin-top:16px;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13.5px}
.facts dt{color:var(--mute)}
.facts dd{margin:0}
.preview{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13.5px;color:#3f3f46}
.file{display:inline-flex;align-items:center;gap:6px;margin:10px 6px 0 0;padding:4px 10px;border-radius:8px;background:var(--soft);font-size:12.5px;color:var(--sub)}
.file svg{width:14px;height:14px}
.acts{display:flex;align-items:center;gap:10px;margin-top:18px}
.pb{height:38px;padding:0 20px;border-radius:10px;background:var(--text);color:#fff;font-weight:600;transition:.15s}
.pb:hover{background:#000}
.gb{height:38px;padding:0 16px;border-radius:10px;color:var(--sub)}
.gb:hover{background:var(--soft)}
.acts .note{margin-left:auto;font-size:12px;color:var(--mute)}

.callout{margin-top:20px;padding:16px 20px;border-radius:14px;background:var(--soft);color:var(--sub);font-size:13.5px}
.callout.warn{background:var(--rose-soft);color:#8f2a2d}
.link{color:var(--accent);cursor:pointer}
.link:hover{text-decoration:underline}

.sec{margin-top:36px}
.sec h4{font-size:13px;font-weight:600;color:var(--sub);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec h4 span{font-weight:400;color:var(--mute)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:14px 20px}
.li+.li{border-top:1px solid var(--line)}
.ck{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.ck svg{width:13px;height:13px;stroke-width:2.4}
.ck.ok{background:var(--green);color:#fff}
.ck.wait{border:1.5px solid var(--amber)}
.ck.todo{border:1.5px dashed #d4d4d8}
.ck.miss{background:var(--gray-soft);color:var(--gray)}
.li .b{flex:1}
.li .d{font-size:12.5px;color:var(--mute)}
.li .r{font-size:12.5px;color:var(--mute);white-space:nowrap}

.follow{display:grid;grid-template-columns:repeat(3,1fr)}
.follow+.follow{border-top:1px solid var(--line)}
.follow>div{padding:16px 20px}
.follow>div+div{border-left:1px solid var(--line)}
.follow .k{font-size:12px;color:var(--mute)}
.follow .v{font-weight:550;margin-top:2px}
.follow .d{font-size:12.5px;color:var(--sub)}
.follow-limit{padding:12px 20px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--sub)}

.ev{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:7px 0;font-size:13.5px}
.ev .tm{color:var(--mute);font-size:12.5px}
.ev .tx{color:var(--sub)}
.ev.new .tx{color:var(--text)}

/* ---------- 停止确认 ---------- */
.mask{position:fixed;inset:0;background:rgba(24,24,27,.32);backdrop-filter:blur(3px);display:none;place-items:center;z-index:20}
.mask.open{display:grid}
.modal{width:460px;background:#fff;border-radius:20px;padding:28px;box-shadow:0 24px 64px rgba(0,0,0,.18)}
.modal h3{font-size:18px;font-weight:650}
.modal .ms{color:var(--sub);font-size:13.5px;margin-top:6px}
.imp{margin:18px 0 0;padding:0;list-style:none;font-size:13.5px}
.imp li{display:flex;gap:10px;padding:6px 0}
.imp i{font-style:normal;width:18px;flex-shrink:0;text-align:center}
.modal .acts{justify-content:flex-end;margin-top:22px}
.danger{background:var(--rose)}
.danger:hover{background:#cf3f44}

@media (max-width:1200px){
  .app{grid-template-columns:64px 320px 1fr}
  .dw{padding:32px 28px 60px}
  .follow{grid-template-columns:1fr}
  .follow>div+div{border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<svg style="display:none">

</svg>

<div class="app">
  <nav class="rail">
    <div class="logo">N</div>
    <button class="nav" data-tip="Chat"><svg><use href="#i-chat"/></svg><span class="dot"></span></button>
    <button class="nav on" data-tip="工作"><svg><use href="#i-work"/></svg></button>
    <button class="nav" data-tip="目标" onclick="location.href='nexus-goals.html'"><svg><use href="#i-goal"/></svg></button>
    <button class="nav" data-tip="人员" onclick="location.href='nexus-people.html'"><svg><use href="#i-people"/></svg></button>
    <button class="nav" data-tip="资料库" onclick="location.href='nexus-library.html'"><svg><use href="#i-lib"/></svg></button>
    <div class="grow"></div>
    <button class="nav" data-tip="Status" onclick="location.href='nexus-status.html'"><svg><use href="#i-status"/></svg></button>
    <button class="nav" data-tip="Settings"><svg><use href="#i-set"/></svg></button>
  </nav>

  <section class="list">
    <div class="lh">
      <h1>工作</h1>
      <div class="hello" id="hello"></div>
      <label class="search"><svg><use href="#i-search"/></svg><input id="q" placeholder="搜索工作、客户或项目"></label>
    </div>
    <div class="seg" id="seg"></div>
    <div class="rows" id="rows"></div>
  </section>

  <main class="detail" id="detail"></main>
</div>

<div class="mask" id="mask" onclick="if(event.target===this)closeStop()">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ================================================================
   统一的工作详情模型（WorkView）
   所有工作使用同一结构与同一渲染函数；字段为空时对应区块自动隐藏。

   WorkView {
     id, title, context, updatedAt,
     state: action | blocked | running | done | ended   // 主状态（WK-02）；推进结果的 attention 才是 action。已完成工作上的补救决定不改主状态
     summary,                 // 状态旁的一句话
     result,                  // 我要的结果
     progress,                // 现在进展
     attention?: {            // 需要用户做的一件事（决定 / 补充 / 处理 / 事故补救），最多一张
       label, title, desc?,
       facts?: [[键, 值]],     // 准确条款：账号、收件人、金额、时间……
       preview?: {text?, files?: []},
       actions: [主操作, ...次操作], note?
     },
     notice?: {tone: info|warn, text},   // 无需用户操作的说明
     criteria: [{state: ok|wait|todo|miss, title, detail?, right?}],  // 完成标准，进度环由此计算
     followups?: [{what, whatNote, how, howNote, next, nextNote, limit?}],  // 检查档位、下次、覆盖/不会做什么
     events: [[时间, 文本, 是否离开期间]]
   }
   ================================================================ */

const STATE = {action:'待你处理', blocked:'受阻', running:'进行中', done:'已完成', ended:'已结束'};
const ORDER = ['action','blocked','running','done','ended'];

const works = [
  { id:'w2', state:'action', title:'A 客户评审材料包', context:'A 客户', updatedAt:'09:02',
    summary:'1 个决定等你，其他步骤仍在进行',
    result:'11-03 评审前，交付一份包含议程、报价表和交付时间表的完整材料包',
    progress:'议程已完成；李明已接受新期限，报价表今天 17:00 前交付',
    attention:{ label:'需要你决定', title:'把议程 v2 发给王总，并请他确认交付时间表', desc:'只发送议程，不包含报价和内部纪要。',
      facts:[['发件','zhang@nexus-consult.com'],['收件','王总 · wang.zong@a-client.com']],
      preview:{ text:'王总您好，附件为 11-03 评审议程 v2，请帮忙确认第 3 页的交付时间表是否可行……', files:['A客户评审议程_v2.docx'] },
      actions:['批准发送','修改','暂不'], note:'10-31 18:00 前有效' },
    criteria:[
      {state:'ok',   title:'议程经你确认', detail:'v2 · 10-29 16:02', right:'已完成'},
      {state:'wait', title:'李明交付报价表', detail:'含单价、数量、税额、总额 · 今天 09:00 检查暂未收到', right:'今天 17:00 截止'},
      {state:'todo', title:'王总确认交付时间表', detail:'等你批准上面的邮件', right:'待开始'},
      {state:'todo', title:'合成材料包 PDF', detail:'报价表和时间表到齐后自动开始', right:'待开始'},
    ],
    followups:[{ what:'李明 · 报价表', whatNote:'指定邮件线程 · 10-29 接手自「跟进李明报价表」',
      how:'工作日 09:00，截止当天再查一次', howNote:'只按这两个已审时间点读取该线程，不是新邮件订阅',
      next:'今天 17:00', nextNote:'今天 09:00 已查过，未收到。17:00 是截止检查，不是实时推送',
      limit:'收到或逾期时通知你。中间来信要等到下一次检查才会发现；不会自动催办，也不会在 17:00 之后继续盯。' }],
    events:[['今天 09:00','检查报价表，暂未收到',1],['10-29 16:02','你确认了议程 v2',1],['10-29 15:10','接手李明报价表的跟进',1],['10-27 14:20','李明接受新期限：10-30 17:00'],['10-26 20:30','从对话中创建这件工作']] },

  { id:'w5', state:'action', title:'深圳出差机票与酒店', context:'个人', updatedAt:'08:47',
    summary:'机票报价 11:00 前有效',
    result:'11-03 上午抵达深圳，总预算 ¥3,000 内',
    progress:'酒店已订好（可免费取消），机票待你确认',
    attention:{ label:'需要你决定', title:'购买东航 MU5331 · ¥1,860',
      facts:[['航班','11-03 08:30 虹桥 T2 → 10:55 宝安 T3 · 经济舱'],['乘机人','张伟'],['付款','招商银行信用卡 · 尾号 6620'],['退改','改期免费一次，起飞 24 小时前退票收 ¥186']],

    summary:'补齐材料后开始',
    result:'按公司模板生成 10 月报销单',
    progress:'已收集 12 张票据，还差 2 张',
    attention:{ label:'需要你补充', title:'2 张发票',
      facts:[['滴滴出行','10-21 · ¥86'],['全季酒店','10-22 · ¥428']],
      actions:['上传发票','没有，跳过'] },
    criteria:[

  { id:'w7', state:'action', title:'客户会前准备', context:'团队', updatedAt:'07:15',
    summary:'重新连接日历后自动继续',
    result:'每场客户会议前 1 小时备好资料，持续到 11-20',

  { id:'w1', state:'ended', title:'跟进李明报价表', context:'A 客户', updatedAt:'10-29',

let sel = 'w2', filter = 'all';
const ic   = n => `<svg><use href="#i-${n}"/></svg>`;
const chip = s => `<span class="chip s-${s}">${STATE[s]}</span>`;
const isActive = w => w.state!=='done' && w.state!=='ended';

/* ---------- 列表 ---------- */
function visibleWorks(){
  const q = document.getElementById('q').value.trim();
  return works.filter(w => (!q || (w.title+w.context+w.summary+(w.attention?w.attention.title:'')).includes(q)) && (filter==='all'||w.state===filter));
}
function ensureSel(ids, empty){
  if(sel && ids.includes(sel)) return;
  if(!ids.length){ sel=''; document.getElementById('detail').innerHTML = `<div class="dw" style="color:var(--mute);padding-top:80px">${empty}</div>`; return; }
  sel = ids[0];
  if(location.hash!=='#'+sel) history.replaceState(null,'','#'+sel);
  renderDetail();
}
function renderList(){
  const q = document.getElementById('q').value.trim();
  document.getElementById('hello').innerHTML = `你离开期间：<b>1 件完成</b>，<b>${works.filter(w=>w.state==='action').length} 件</b>需要你处理`;
  const base = works.filter(w => !q || (w.title+w.context+w.summary+(w.attention?w.attention.title:'')).includes(q));
  document.getElementById('seg').innerHTML =
    `<button class="${filter==='all'?'on':''}" onclick="setF('all')">全部<span>${base.length}</span></button>` +
    ORDER.map(s=>`<button class="${filter===s?'on':''}" onclick="setF('${s}')">${STATE[s]}<span>${base.filter(w=>w.state===s).length}</span></button>`).join('');
  ensureSel(visibleWorks().map(w=>w.id), '当前筛选下没有工作');
  let h='';
  ORDER.forEach(s=>{
    const g = base.filter(w=>w.state===s && (filter==='all'||filter===s));
    if(!g.length) return;
    if(filter==='all') h += `<div class="gl">${STATE[s]}</div>`;
    g.forEach(w=>{
      const line = w.attention ? w.attention.title : w.summary;
      h += `<div class="row s-${w.state} ${w.id===sel?'sel':''}" onclick="pick('${w.id}')">
        <span class="sd"></span>
        <div class="m"><div class="t"><span class="tt">${w.title}</span><span class="tm">${w.updatedAt}</span></div>
        <div class="nx">${line}</div></div></div>`;
    });
  });
  document.getElementById('rows').innerHTML = h || `<div class="gl" style="text-align:center;padding:48px 0">没有匹配的工作</div>`;
}
function setF(f){ filter=f; renderList(); }
function pick(id){ sel=id; if(location.hash!=='#'+id) history.replaceState(null,'','#'+id); renderList(); renderDetail(); document.getElementById('detail').scrollTop=0; }

/* ---------- 详情：唯一模板 ---------- */
function renderDetail(){
  const w = works.find(x=>x.id===sel);
  if(!w) return;
  const met = w.criteria.filter(c=>c.state==='ok').length, total = w.criteria.length;
  const a = w.attention;

  const header = `
    <div class="top"><span>${w.context}</span><span>·</span><span>更新于 ${w.updatedAt}</span><span class="sp"></span>
      <button class="ib">在聊天中讨论</button>
      ${isActive(w) ? `<button class="ib">暂停</button><button class="ib" onclick="openStop()">停止</button>` : ''}
    </div>
    <h2>${w.title}</h2>
    <div class="why">${chip(w.state)}${w.attention&&w.state==='done'?`<span class="chip fix">补救未完成</span>`:''}<span>${w.summary}</span></div>`;

  const hero = `
    <div class="hero s-${w.state}">
      <div class="ring" style="--p:${Math.round(met/total*100)}"><b>${met}/${total}<small>项标准</small></b></div>
      <div><div class="k">我要的结果</div><div class="v">${w.result}</div>
           <div class="k">现在进展</div><div class="v">${w.progress}</div></div>
    </div>`;

  const attention = !a ? '' : `
    <div class="ask">
      <div class="lab">${a.label}</div>
      <h3>${a.title}</h3>
      ${a.desc ? `<p>${a.desc}</p>` : ''}
      ${a.facts ? `<dl class="facts">${a.facts.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>` : ''}
      ${a.preview ? `<div class="preview">${a.preview.text||''}<div>${(a.preview.files||[]).map(f=>`<span class="file">${ic('doc')}${f}</span>`).join('')}</div></div>` : ''}
      <div class="acts">
        ${a.actions.map((t,i)=>`<button class="${i?'gb':'pb'}">${t}</button>`).join('')}
        ${a.note ? `<span class="note">${a.note}</span>` : ''}
      </div>
    </div>`;

  const notice = w.notice ? `<div class="callout ${w.notice.tone==='warn'?'warn':''}">${w.notice.text}</div>` : '';

  const criteria = `
    <div class="sec"><h4>完成标准 <span>全部满足才算完成</span></h4><div class="box">
      ${w.criteria.map(c=>`<div class="li">
        <span class="ck ${c.state}">${c.state==='ok'?ic('check'):c.state==='miss'?ic('x'):''}</span>
        <div class="b">${c.title}${c.detail?`<div class="d">${c.detail}</div>`:''}</div>
        ${c.right?`<span class="r">${c.right}</span>`:''}</div>`).join('')}
    </div></div>`;

  const follow = !w.followups ? '' : `
    <div class="sec"><h4>持续跟进</h4><div class="box">
      ${w.followups.map(f=>`<div>
        <div class="follow">
          <div><div class="k">跟进什么</div><div class="v">${f.what}</div><div class="d">${f.whatNote}</div></div>
          <div><div class="k">怎么检查</div><div class="v">${f.how}</div><div class="d">${f.howNote}</div></div>
          <div><div class="k">下次检查</div><div class="v">${f.next}</div><div class="d">${f.nextNote}</div></div>
        </div>
        ${f.limit?`<div class="follow-limit">${f.limit}</div>`:''}
      </div>`).join('')}
    </div></div>`;

  const events = `
    <div class="sec"><h4>动态</h4>
      ${w.events.map(([t,x,n])=>`<div class="ev ${n?'new':''}"><span class="tm">${t}</span><span class="tx">${x}</span></div>`).join('')}
    </div>`;

  document.getElementById('detail').innerHTML =
    `<div class="dw">${header}${hero}${notice}${attention}${criteria}${follow}${events}</div>`;
}

/* ---------- 停止确认：由同一数据生成影响预览 ---------- */
function openStop(){
  const w = works.find(x=>x.id===sel);
  const open = w.criteria.filter(c=>c.state==='wait'||c.state==='todo');
  const done = w.criteria.filter(c=>c.state==='ok');
  document.getElementById('modal').innerHTML = `
    <h3>停止「${w.title}」？</h3>
    <div class="ms">剩余步骤和后续检查会停止，已发生的结果不会撤销。</div>
    <ul class="imp">
      ${open.map(c=>`<li><i style="color:var(--rose)">✕</i>停止：${c.title}</li>`).join('')}
      ${(w.followups||[]).map(f=>`<li><i style="color:var(--rose)">✕</i>不再跟进：${f.what}</li>`).join('')}
      ${done.map(c=>`<li><i style="color:var(--green)">✓</i>保留：${c.title}</li>`).join('')}
    </ul>
    <div class="acts">
      <button class="gb" onclick="closeStop()">取消</button>
      ${w.followups ? `<button class="gb" onclick="closeStop()">交给其他工作继续</button>` : ''}
      <button class="pb danger" onclick="closeStop()">停止工作</button>
    </div>`;
  document.getElementById('mask').classList.add('open');
}
function closeStop(){ document.getElementById('mask').classList.remove('open'); }

document.getElementById('q').addEventListener('input', renderList);
const boot = location.hash.slice(1);
if(works.some(w=>w.id===boot)) sel = boot;
renderList(); renderDetail();
</script>
