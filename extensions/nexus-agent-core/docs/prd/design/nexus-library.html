<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus · 资料库</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --line:#ececef; --soft:#f3f3f5;
  --text:#18181b; --sub:#63636e; --mute:#a1a1aa;
  --accent:#5b5bd6; --accent-soft:#f0f0fd;
  --amber:#d97706; --amber-soft:#fef6e7;
  --rose:#e5484d;  --rose-soft:#fdeeee;
  --blue:#3e63dd;  --blue-soft:#edf2fe;
  --green:#30a46c; --green-soft:#e9f7ef;
  --gray:#8b8d98;  --gray-soft:#f1f1f3;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font:14px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:72px 380px 1fr;height:100vh}
.app>*{min-height:0}

/* ---------- 导航 ---------- */
.rail{display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:6px;border-right:1px solid var(--line);background:var(--panel)}
.logo{width:34px;height:34px;border-radius:10px;background:var(--text);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;margin-bottom:18px}
.nav{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--mute);position:relative;transition:.15s}
.nav svg{width:21px;height:21px}
.nav:hover{background:var(--soft);color:var(--sub)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.nav .dot{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 2px #fff}
.nav[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:52px;background:var(--text);color:#fff;font-size:12px;padding:3px 8px;border-radius:6px;white-space:nowrap;z-index:9}
.rail .grow{flex:1}

/* ---------- 列表 ---------- */
.list{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line)}
.lh{padding:26px 24px 12px}
.lh .hr{display:flex;align-items:center}
.lh h1{font-size:22px;font-weight:650;letter-spacing:-.01em;flex:1}
.lh .hello{color:var(--sub);font-size:13px;margin-top:4px}
.newb{height:32px;padding:0 12px;border-radius:9px;background:var(--text);color:#fff;font-size:13px;font-weight:600}
.search{margin-top:16px;display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:0 12px;color:var(--mute)}
.search input{flex:1;border:0;background:none;outline:none;padding:9px 0;color:var(--text)}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px 24px 8px}
.seg button{padding:4px 10px;border-radius:999px;font-size:13px;color:var(--sub);white-space:nowrap;transition:.15s}
.seg button:hover{background:var(--soft)}
.seg button.on{background:var(--text);color:#fff}
.seg button span{opacity:.55;margin-left:3px}
.tools{display:flex;align-items:center;gap:8px;padding:0 24px 8px;font-size:12.5px;color:var(--mute)}
.tools select{border:0;background:none;color:var(--sub);outline:none;cursor:pointer;font-size:12.5px}
.tools .sp{flex:1}
.vt{display:flex;background:var(--soft);border-radius:8px;padding:2px}
.vt button{width:28px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--mute)}
.vt button svg{width:15px;height:15px}
.vt button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.rows{flex:1;overflow:auto;padding:0 12px 24px}
.gl{font-size:12px;color:var(--mute);padding:14px 12px 6px}
.row{display:flex;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;transition:.15s;align-items:center}
.row:hover{background:var(--soft)}
.row.sel{background:var(--accent-soft)}
.row .m{flex:1;min-width:0}
.row .tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin{color:var(--amber)}
.pin svg{width:14px;height:14px;fill:currentColor;stroke:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 12px}
.gc{border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.15s;background:#fff}
.gc:hover{border-color:#d9d9de}
.gc.sel{outline:2px solid var(--accent);outline-offset:-1px}
.gc .th{height:92px;display:grid;place-items:center;background:var(--cs)}
.gc .th{position:relative}
.mini{width:58%;height:72px;margin-top:20px;background:#fff;border-radius:6px 6px 0 0;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:10px 10px 0;align-self:end}
.mini i{display:block;height:5px;border-radius:3px;background:#eceef1;margin-bottom:6px}
.mini i:first-child{width:60%;background:var(--c);opacity:.5}
.gc .th .tl{position:absolute;top:8px;left:10px;font-size:10px;font-weight:700;color:var(--c);letter-spacing:.03em}
.gc .gb2{padding:8px 10px}
.gc .tt{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc .meta{font-size:11.5px;color:var(--mute)}

/* ---------- 文件类型 ---------- */
.ft{width:36px;height:40px;border-radius:9px;background:var(--cs);color:var(--c);display:grid;place-items:center;font-size:10px;font-weight:700;letter-spacing:.02em;flex-shrink:0}
.ft.lg{width:52px;height:58px;border-radius:13px;font-size:12px}
.t-docx{--c:#3e63dd;--cs:#edf2fe}
.t-xlsx{--c:#2f9e74;--cs:#e8f6ef}
.t-pdf{--c:#e5484d;--cs:#fdeeee}
.t-md{--c:#18181b;--cs:#f1f1f3}
.t-png{--c:#8e4ec6;--cs:#f7f0fd}
.t-m4a{--c:#d97706;--cs:#fef6e7}
.t-zip{--c:#71717a;--cs:#f1f1f3}
.t-pptx{--c:#c2410c;--cs:#ffece3}

/* ---------- 详情（统一模板） ---------- */
.detail{overflow:auto}
.dw{max-width:900px;margin:0 auto;padding:40px 48px 80px}
.top{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px}
.top .sp{flex:1}
.ib{height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--sub);font-size:13px;transition:.15s}
.ib:hover{border-color:#dcdce0;color:var(--text)}
.ib.dark{background:var(--text);border-color:var(--text);color:#fff}
.ib.dark:hover{background:#000}
.menu{position:relative}
.dd{display:none;position:absolute;right:0;top:40px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.1);min-width:170px;padding:6px;z-index:10}
.menu.open .dd{display:block}
.dd button{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:8px;font-size:13.5px;color:var(--text)}
.dd button:hover{background:var(--soft)}
.dd .red{color:var(--rose)}

.title{display:flex;gap:16px;align-items:center;margin:18px 0 0}
h2{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.3;word-break:break-all}
.why{color:var(--sub);font-size:13.5px;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px}
.badge.out{background:var(--green-soft);color:var(--green)}
.badge.in{background:var(--soft);color:var(--sub)}
.badge.del{background:var(--rose-soft);color:var(--rose)}

/* 预览 */
.pv{margin-top:24px;background:#eef0f3;border:1px solid var(--line);border-radius:18px;padding:28px;display:grid;place-items:center;position:relative}
.pv .lab{position:absolute;top:12px;left:16px;font-size:12px;color:var(--mute)}
.pv .edit{position:absolute;top:10px;right:12px}
.paper{width:100%;max-width:560px;background:#fff;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.06);padding:36px 44px;font-size:13px;color:#3f3f46}
.paper h6{font-size:17px;font-weight:650;color:var(--text);margin-bottom:4px}
.paper .s{color:var(--mute);font-size:12px;margin-bottom:16px}
.paper .ln{height:8px;background:#eef0f3;border-radius:4px;margin:9px 0}
.paper ol{padding-left:18px;margin:6px 0 12px}
.paper ol li{margin:4px 0}
.sheet{width:100%;max-width:620px;background:#fff;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.06);overflow:hidden;font-size:12.5px}
.sheet table{width:100%;border-collapse:collapse}
.sheet th{background:#f6f7f8;font-weight:600;color:var(--sub);text-align:left}
.sheet th,.sheet td{border:1px solid #edeef0;padding:7px 10px}
.sheet td.n{text-align:right;font-variant-numeric:tabular-nums}
.sheet .flag td{background:#fff8f0}
.img{width:100%;max-width:420px;aspect-ratio:4/3;border-radius:10px;background:linear-gradient(135deg,#f5f0ff,#e8f3ff);display:grid;place-items:center;color:var(--sub);box-shadow:0 4px 20px rgba(0,0,0,.06)}
.rcpt{background:#fff;width:200px;padding:16px;border-radius:6px;font-size:12px;line-height:1.9;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.rcpt b{font-size:13px}
.aud{width:100%;max-width:560px;background:#fff;border-radius:14px;padding:22px 24px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.wave{display:flex;align-items:center;gap:3px;height:56px;margin:14px 0 10px}
.wave i{flex:1;background:#f3c98b;border-radius:2px}
.aud .ctl{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--mute)}
.play{width:36px;height:36px;border-radius:50%;background:var(--text);color:#fff;display:grid;place-items:center}
.play svg{width:14px;height:14px;fill:#fff;stroke:none}
.zipl{width:100%;max-width:560px;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.06);overflow:hidden}
.zipl div{display:flex;gap:10px;align-items:center;padding:9px 16px;font-size:13px}
.zipl div+div{border-top:1px solid var(--line)}
.zipl .ft{width:24px;height:28px;font-size:8px;border-radius:6px}
.zipl span.r{margin-left:auto;color:var(--mute);font-size:12px}
.md{width:100%;max-width:600px;background:#fff;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.06);padding:28px 36px;font-size:13.5px;line-height:1.8}
.md h6{font-size:16px;font-weight:650;margin-bottom:6px}
.md .h{font-weight:600;margin-top:10px}
.md ul{padding-left:18px}

.callout{margin-top:20px;padding:16px 20px;border-radius:14px;background:var(--soft);color:var(--sub);font-size:13.5px;display:flex;gap:12px;align-items:center}
.callout .sp{flex:1}
.callout.warn{background:var(--rose-soft);color:#8f2a2d}
.callout b{color:var(--text)}

.share{margin-top:20px;padding:20px 24px;border-radius:16px;border:1px solid #f6e3bd;background:linear-gradient(180deg,#fffaf0,#fff);display:flex;gap:16px;align-items:center}
.share .b{flex:1}
.share .lab{font-size:12px;font-weight:600;color:var(--amber);letter-spacing:.04em}
.share .v{font-weight:600;margin-top:2px}
.share .d{font-size:12.5px;color:var(--sub)}
.share.private{border-color:var(--line);background:var(--panel)}
.share.private .lab{color:var(--sub)}

.sec{margin-top:36px}
.sec h4{font-size:13px;font-weight:600;color:var(--sub);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec h4 span{font-weight:400;color:var(--mute)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:14px 20px}
.li+.li{border-top:1px solid var(--line)}
.li.click{cursor:pointer}
.li.click:hover{background:#fafafb}
.li .b{flex:1;min-width:0}
.li .d{font-size:12.5px;color:var(--mute)}
.li .r{font-size:12.5px;color:var(--mute);white-space:nowrap}
.vn{width:34px;height:24px;border-radius:7px;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--sub);flex-shrink:0}
.vn.cur{background:var(--text);color:#fff}
.cur-tag{font-size:11.5px;color:var(--green);font-weight:600;margin-left:6px}
.old{color:var(--mute)}
.gbtn{height:30px;padding:0 10px;border-radius:8px;color:var(--sub);font-size:12.5px}
.gbtn:hover{background:var(--soft)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 16px;padding:16px 20px;font-size:13.5px}
.kv dt{color:var(--mute)}
.kv dd{margin:0}
.link{color:var(--accent);cursor:pointer}
.link:hover{text-decoration:underline}

/* ---------- 弹窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(24,24,27,.32);backdrop-filter:blur(3px);display:none;place-items:center;z-index:20}
.mask.open{display:grid}
.modal{width:500px;background:#fff;border-radius:20px;padding:28px;box-shadow:0 24px 64px rgba(0,0,0,.18)}
.modal.wide{width:560px;max-height:88vh;overflow:auto}
.wopt{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;margin-top:8px;font-size:13.5px}
.wopt.on{border-color:var(--text);background:#fafafa}
.wopt i{width:14px;height:14px;border-radius:50%;border:1.5px solid #d4d4d8;flex-shrink:0}
.wopt.on i{border:4.5px solid var(--text)}
.wopt .b{flex:1}
.wopt .d{font-size:12.5px;color:var(--mute)}
.ok{color:var(--green);font-size:12px;font-weight:600;margin-left:6px}
.tag{font-size:12px;font-weight:600;margin-left:6px;white-space:nowrap}
.tag.ok{color:var(--green)}
.tag.amber{color:var(--amber)}
.tag.mute{color:var(--mute)}
.cands{display:grid;gap:8px;margin-top:8px}
.cand{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cand .b{flex:1;min-width:0}
.cand .d{font-size:12.5px;color:var(--mute)}
.field{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px;background:#fff}
.mail{background:#fafafb;border-radius:10px;padding:10px 14px;font-size:13.5px;color:#3f3f46;margin-top:8px;line-height:1.65}
.file{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:3px 10px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:12.5px}
.acts .note{margin-right:auto;font-size:12px;color:var(--mute)}
.call{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--amber-soft);color:#7a4a06;font-size:13px}
.modal h3{font-size:18px;font-weight:650}
.modal .ms{color:var(--sub);font-size:13.5px;margin-top:6px}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:.15s}
.opt b{display:block;font-size:14.5px}
.opt span{font-size:12.5px;color:var(--mute)}
.opt.on{border-color:var(--text);background:#fafafa}
.mlab{font-size:12px;color:var(--mute);margin:12px 0 6px}
.imp{margin:0;padding:0;list-style:none;font-size:13.5px}
.imp li{display:flex;gap:10px;padding:5px 0;color:var(--sub)}
.imp i{font-style:normal;width:18px;flex-shrink:0;text-align:center}
.drop{margin-top:18px;border:1.5px dashed #d4d4d8;border-radius:16px;padding:34px;text-align:center;color:var(--sub);background:#fafafb}
.drop b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.limits{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:14px;font-size:12.5px;color:var(--sub)}
.limits span{color:var(--mute)}
.acts{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:22px}
.pb{height:38px;padding:0 20px;border-radius:10px;background:var(--text);color:#fff;font-weight:600}
.pb:hover{background:#000}
.pb.danger{background:var(--rose)}
.gb{height:38px;padding:0 16px;border-radius:10px;color:var(--sub)}
.gb:hover{background:var(--soft)}

@media (max-width:1200px){
  .app{grid-template-columns:64px 320px 1fr}
  .dw{padding:32px 28px 60px}
}
</style>
</head>
<body>

  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
</svg>

<div class="app">
  <nav class="rail">
    <div class="logo">N</div>
    <button class="nav" data-tip="Chat"><svg><use href="#i-chat"/></svg><span class="dot"></span></button>
    <button class="nav" data-tip="工作" onclick="location.href='nexus-work.html'"><svg><use href="#i-work"/></svg></button>
    <button class="nav" data-tip="目标" onclick="location.href='nexus-goals.html'"><svg><use href="#i-goal"/></svg></button>
    <button class="nav" data-tip="人员" onclick="location.href='nexus-people.html'"><svg><use href="#i-people"/></svg></button>
    <button class="nav on" data-tip="资料库"><svg><use href="#i-lib"/></svg></button>
    <div class="grow"></div>
    <button class="nav" data-tip="Status" onclick="location.href='nexus-status.html'"><svg><use href="#i-status"/></svg></button>
    <button class="nav" data-tip="Settings"><svg><use href="#i-set"/></svg></button>
  </nav>

  <section class="list">

const ic = n => `<svg><use href="#i-${n}"/></svg>`;
const ft = (f,lg) => `<span class="ft t-${f.type} ${lg?'lg':''}">${f.type.toUpperCase()}</span>`;
const typeName = {docx:'Word 文档',xlsx:'Excel 表格',pdf:'PDF',md:'Markdown',png:'图片',m4a:'音频',zip:'压缩包',pptx:'演示稿'};

/* ---------- 列表 ---------- */
function renderList(){
  const q = document.getElementById('q').value.trim();
  const c = document.getElementById('ctx').value;
  const live = files.filter(f=>!f.deleted);
  const F = [['all','全部',live.length],['deliverable','成果',live.filter(f=>f.origin==='deliverable').length],
             ['upload','我上传的',live.filter(f=>f.origin==='upload').length],['pinned','已固定',live.filter(f=>f.pinned).length],
             ['trash','回收站',files.filter(f=>f.deleted).length]];
  document.getElementById('seg').innerHTML = F.map(([k,l,n])=>`<button class="${filter===k?'on':''}" onclick="setF('${k}')">${l}<span>${n}</span></button>`).join('');
  let rows = files.filter(f => (filter==='trash' ? f.deleted : !f.deleted) &&
    (filter==='all'||filter==='trash'||(filter==='pinned'?f.pinned:f.origin===filter)) &&
    (!c || f.context===c) && (!q || (f.name+f.context+(f.ownerWork||'')).includes(q)));
  rows.sort(document.getElementById('sort').value==='n' ? (a,b)=>a.name.localeCompare(b.name,'zh') : (a,b)=>b.sortKey-a.sortKey);

  const meta = f => f.deleted ? `${f.daysLeft||f.deleted.daysLeft} 天后永久删除` : `${f.context} · ${f.updatedAt} · ${f.size}`;
  const el = document.getElementById('rows');
  if(!rows.length){ el.innerHTML = `<div class="gl" style="text-align:center;padding:48px 0">${filter==='trash'?'回收站是空的':'没有匹配的文件'}</div>`; return; }
  el.innerHTML = view==='list'
    ? rows.map(f=>`<div class="row ${f.id===sel?'sel':''}" onclick="pick('${f.id}')">${ft(f)}
        <div class="m"><div class="tt">${f.name}</div><div class="meta">${meta(f)}</div></div>
        ${f.pinned?`<span class="pin">${ic('pin')}</span>`:''}</div>`).join('')
    : `<div class="grid">${rows.map(f=>`<div class="gc t-${f.type} ${f.id===sel?'sel':''}" onclick="pick('${f.id}')">
        <div class="th"><span class="tl">${f.type.toUpperCase()}</span><div class="mini"><i></i><i></i><i style="width:80%"></i><i style="width:65%"></i></div></div><div class="gb2"><div class="tt">${f.pinned?'★ ':''}${f.name}</div><div class="meta">${f.deleted?meta(f):f.updatedAt+' · '+f.size}</div></div></div>`).join('')}</div>`;
}
function setF(f){
  filter=f;
  const inView = x => (f==='trash') === !!x.deleted && (f==='all'||f==='trash'||(f==='pinned'?x.pinned:x.origin===f));
  const cur = files.find(x=>x.id===sel);
  if(!inView(cur)){ const first = files.find(inView); if(first){ sel=first.id; renderDetail(); } }
  renderList();
}
function setView(v){ view=v; document.getElementById('vl').classList.toggle('on',v==='list'); document.getElementById('vg').classList.toggle('on',v==='grid'); renderList(); }
function pick(id){ sel=id; renderList(); renderDetail(); document.getElementById('detail').scrollTop=0; }

/* ---------- 预览：按类型选择渲染器 ---------- */
function preview(f){
  const p = f.preview;
  switch(f.type){
    case 'docx': case 'pdf': case 'pptx':
      return `<div class="paper"><h6>${p.title}</h6><div class="s">${p.sub}</div><ol>${p.items.map(i=>`<li>${i}</li>`).join('')}</ol><div class="ln" style="width:92%"></div><div class="ln" style="width:78%"></div><div class="ln" style="width:85%"></div></div>`;
    case 'xlsx':
      return `<div class="sheet"><table>${p.rows.map((r,i)=>i===0?`<tr>${r.map(c=>`<th>${c}</th>`).join('')}</tr>`
        :`<tr class="${(p.flags||[]).includes(i)?'flag':''}">${r.map(c=>`<td class="${/\d/.test(c)?'n':''}">${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
    case 'md':
      return `<div class="md"><h6>${p.title}</h6>${p.sections.map(([h,l])=>`<div class="h">${h}</div><ul>${l.map(x=>`<li>${x}</li>`).join('')}</ul>`).join('')}</div>`;
    case 'm4a':
      return `<div class="aud"><b>录音</b><div class="wave">${Array.from({length:64},(_,i)=>`<i style="height:${18+Math.abs(Math.sin(i*1.7)*Math.cos(i*.45))*80}%"></i>`).join('')}</div>
        <div class="ctl"><span class="play">${ic('play')}</span><span>00:00 / ${p.duration}</span></div></div>`;
    case 'zip':
      return `<div class="zipl">${p.entries.map(([n,s])=>`<div><span class="ft t-pdf">PDF</span>${n}<span class="r">${s}</span></div>`).join('')}</div>`;
    case 'png':
      return `<div class="img"><div class="rcpt">${p.receipt.map((l,i)=>i?`<div>${l}</div>`:`<b>${l}</b>`).join('')}</div></div>`;
  }
}

/* ---------- 详情：唯一模板 ---------- */
function renderDetail(){
  const f = files.find(x=>x.id===sel);
  const del = !!f.deleted;
  const header = `
    <div class="top"><span>${f.context}</span><span>·</span><span>${typeName[f.type]} · ${f.size}</span><span class="sp"></span>
      ${del ? `<button class="ib" onclick="openPurge()">永久删除</button><button class="ib dark">恢复</button>` : `
      <button class="ib">在聊天中讨论</button><button class="ib">下载</button>
      <button class="ib dark" onclick="openShare()">分享</button>
      <div class="menu" id="more"><button class="ib" onclick="this.parentNode.classList.toggle('open')">···</button>
        <div class="dd">${f.origin==='upload'?'<button>用作某件工作的成果…</button>':''}<button>重命名</button><button>${f.pinned?'取消固定':'固定'}</button><button class="red" onclick="openDelete()">移到回收站</button></div></div>`}
    </div>
    <div class="title">${ft(f,true)}<div><h2>${f.name}</h2>
      <div class="why">${del ? `<span class="badge del">在回收站</span>`
        : f.origin==='deliverable' ? `<span class="badge out">成果</span>来自「<span class="link" onclick="location.href='nexus-work.html'">${f.ownerWork}</span>」`
        : `<span class="badge in">你上传的</span>作为输入资料使用`}
        <span>· 更新于 ${f.updatedAt}</span></div></div></div>`;

  const pv = `<div class="pv"><span class="lab">${f.editable?'可在线编辑':'预览'}</span>${f.editable&&!del?`<button class="ib edit">编辑</button>`:''}${preview(f)}</div>`;

  const notice = del
    ? `<div class="callout warn"><span><b>将在 ${f.deleted.daysLeft} 天后永久删除。</b>恢复后仍是私有文件，不会自动重新公开。</span></div>`
    : '';

  const share = !f.share || del ? '' : f.share.mode==='public' ? `
    <div class="share"><div class="b"><div class="lab">临时公开链接</div>
      <div class="v">任何拿到链接的人都能查看 ${f.share.version} · ${f.share.expiresIn}自动失效</div>
      <div class="d">对方已下载的副本无法收回</div></div>
      <button class="ib">复制链接</button><button class="ib dark" style="background:var(--rose);border-color:var(--rose)">立即撤销</button></div>`
    : `<div class="share private"><div class="b"><div class="lab">私有链接</div>
      <div class="v">只有你登录后可以打开 · ${f.share.version}</div><div class="d">适合发给自己或在聊天中引用，不能用于对外分享</div></div>
      <button class="ib">复制链接</button></div>`;

  const versions = `
    <div class="sec"><h4>版本 <span>每个版本都记录由谁生成</span></h4><div class="box">
      ${f.versions.map(v=>`<div class="li"><span class="vn ${v.current?'cur':''}">${v.v}</span>
        <div class="b ${v.current?'':'old'}"><div>${v.by}${v.current?'<span class="cur-tag">当前</span>':''}</div><div class="d">${v.date}${v.note?' · '+v.note:''}</div></div>
        ${!v.current&&!del?`<button class="gbtn">设为当前</button><button class="gbtn">删除此版本</button>`:''}</div>`).join('')}
    </div></div>`;

  const used = `
    <div class="sec"><h4>使用它的工作</h4><div class="box">
      ${f.usedBy.length ? f.usedBy.map(u=>`<div class="li click" onclick="location.href='nexus-work.html'">
        <div class="b">${u.work}<div class="d">${u.role}</div></div><span class="r">${ic('right')}</span></div>`).join('')
        : `<div class="li"><div class="b d">没有工作在使用</div></div>`}
    </div></div>`;

  const facts = `<div class="sec"><h4>来源</h4><div class="box"><dl class="kv">${f.facts.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div></div>`;

  document.getElementById('detail').innerHTML = `<div class="dw">${header}${notice}${pv}${share}${versions}${used}${facts}</div>`;
}

    }},
  {id:'personal', email:'zhang.wei@gmail.com', title:'个人邮箱', who:'张伟（个人）',
    ident:'个人身份', fit: ctx => ctx==='个人' || ctx==='账号',
    note:'生活与个人事务；用作客户交付会把个人账号纳入这次披露'},
];
let shareMode = 'send', shareFrom = 'consult', shareTo = 0, shareDraft = '';

function boxesFor(f){
  return MAILBOXES.map(m=>{
    const extra = m.resolve ? m.resolve(f.context) : null;
    if(m.resolve && !extra) return null;
    return {...m, ...(extra||{})};
  }).filter(Boolean);
}
function defaultFrom(f){ return boxesFor(f).find(m=>m.fit(f.context))?.id || 'consult'; }
function grabDraft(){ const el = document.querySelector('#modal .mail'); if(el) shareDraft = el.innerText; }

function show(html, wide){
  const m = document.getElementById('modal');
  m.innerHTML = html; m.classList.toggle('wide', !!wide);
  const more = document.getElementById('more'); if(more) more.classList.remove('open');
  document.getElementById('mask').classList.add('open');
}
function closeModal(){ document.getElementById('mask').classList.remove('open'); document.getElementById('modal').classList.remove('wide'); }
function pickOpt(el){ el.parentNode.querySelectorAll('.opt').forEach(o=>o.classList.remove('on')); el.classList.add('on'); }
function pickW(el){ el.parentNode.querySelectorAll('.wopt').forEach(o=>o.classList.remove('on')); el.classList.add('on'); }
function pickFrom(id){ grabDraft(); shareFrom = id; renderShare(); }
function pickTo(i){ grabDraft(); shareTo = i; renderShare(); }
function recipsOf(f){
  if(!CONTACTS[f.context]){
    CONTACTS[f.context] = [{name:'尚未指定', email:'', verified:false, disclose:'unknown', role:'这次发送的收件人',
      identity:{ source:`「${f.context}」还没有对齐到具体的人`, candidates:[] }}];
  }
  return CONTACTS[f.context];
}
function sendable(r){ return r && r.verified && r.disclose==='allowed' && r.email; }
function confirmId(ri, ci){
  const f = files.find(x=>x.id===sel), list = recipsOf(f), r = list[ri];
  if(!r) return;
  if(ci==='new'){ r._new = true; renderShare(); return; }
  const c = r.identity.candidates[ci];
  Object.assign(r, {name:c.name, email:c.email, verified:true, role:c.role||r.role, disclose:c.disclose||'unknown', identity:null, _new:false});
  shareTo = ri; renderShare();
}
function saveNew(ri){
  const name = (document.getElementById('newn')||{value:''}).value.trim();
  const email = (document.getElementById('newe')||{value:''}).value.trim();
  if(!name || !email) return;
  const r = recipsOf(files.find(x=>x.id===sel))[ri];
  Object.assign(r, {name, email, verified:true, disclose:'unknown', identity:null, _new:false, role:r.role||'这次指定'});
  shareTo = ri; renderShare();
}
function grantDisclose(ri){
  recipsOf(files.find(x=>x.id===sel))[ri].disclose = 'allowed';
  shareTo = ri; renderShare();
}

function openShare(){
  const f = files.find(x=>x.id===sel);
  const recips = recipsOf(f);
  shareMode = (recips.length && f.origin==='deliverable') ? 'send' : (f.context!=='个人' && f.context!=='账号' ? 'send' : 'private');
  shareFrom = defaultFrom(f);
  shareTo = Math.max(0, recips.findIndex(sendable));
  shareDraft = '';
  renderShare();
}
function setShare(mode){ grabDraft(); shareMode = mode; renderShare(); }

function renderShare(){
  const f = files.find(x=>x.id===sel), cur = f.versions.find(v=>v.current);
  const recips = recipsOf(f);
  const client = f.context!=='个人' && f.context!=='账号';
  const hasReady = recips.some(sendable);
  const opt = (k,t,s) => `<div class="opt ${shareMode===k?'on':''}" onclick="setShare('${k}')"><b>${t}</b><span>${s}</span></div>`;
  let body = '', acts = '';

  if(shareMode==='send'){
    if(shareTo<0 || !recips[shareTo]) shareTo = Math.max(0, recips.findIndex(sendable));
    const to = recips[shareTo] || recips[0];
    const canSend = sendable(to);
    const work = f.ownerWork || (f.usedBy[0]&&f.usedBy[0].work) || '新建交付工作';
    const boxes = boxesFor(f);
    if(!boxes.some(m=>m.id===shareFrom)) shareFrom = defaultFrom(f);
    const from = boxes.find(m=>m.id===shareFrom) || boxes[0];
    const fit = from && from.fit(f.context);
    const draft = shareDraft || (to && to.email ? `${to.name}您好，附件为「${f.name}」${cur.v}，请查收。如需确认，直接回复这封邮件即可。` : '');
    const idTag = r => r.verified ? `<span class="tag ok">身份已验证</span>` : `<span class="tag amber">身份待确认</span>`;
    const dTag = r => r.disclose==='allowed' ? `<span class="tag ok">来源允许披露</span>`
      : r.disclose==='denied' ? `<span class="tag mute">来源拒绝披露</span>`
      : `<span class="tag amber">来源尚未允许披露</span>`;
    const gate = !to ? ''
      : !to.verified ? `<div class="call">「${to.name}」还没有对齐到具体的人。确认身份可以在这次发送里完成，不必先去人员页。身份确认也不等于可以把这份资料发给对方。</div>
          ${to.identity?`<div class="mlab">${to.identity.source}</div><div class="cands">
            ${(to.identity.candidates||[]).map((c,i)=>`<div class="cand"><div class="b"><div>${c.name}</div><div class="d">${c.org}${c.email?' · '+c.email:''}</div></div><button class="pb" onclick="confirmId(${shareTo},${i})">是此人</button></div>`).join('')}
            <div class="cand"><div class="b"><div>都不是</div><div class="d">在这次发送里写下是谁，不离开当前文件</div></div><button class="gb" onclick="confirmId(${shareTo},'new')">指定</button></div>
          </div>`:''}
          ${to._new?`<input class="field" id="newn" placeholder="姓名"><input class="field" id="newe" placeholder="这个上下文里的邮箱"><button class="pb" style="margin-top:8px" onclick="saveNew(${shareTo})">记入并继续这次发送</button>`:''}`
      : to.disclose!=='allowed' ? `<div class="call">「${to.name}」身份已验证（${to.email}），但来源尚未允许向其披露「${f.context}」的资料。已验证不是外发许可。</div>
          <button class="ib" style="margin-top:8px" onclick="grantDisclose(${shareTo})">允许向${to.name}披露「${f.context}」这一次</button>`
      : '';
    body = `
      <div class="mlab">从哪个邮箱发送 · 账号决定对方看到的身份和这次披露范围</div>
      <div class="wset">${boxes.map(m=>`<div class="wopt ${m.id===shareFrom?'on':''}" onclick="pickFrom('${m.id}')"><i></i>
        <div class="b">${m.title} · ${m.email}${m.id===defaultFrom(f)?'<span class="ok">与此上下文一致</span>':''}<div class="d">${m.who} · ${m.note}</div></div></div>`).join('')}</div>
      ${fit?'':`<div class="call">「${from.title}」不是「${f.context}」的常用发件身份。发出去后，对方看到的是${from.ident}（${from.email}），这次披露会落到该账号的往来里。</div>`}
      <div class="mlab">发给谁 · 身份确认和披露许可分开看，同一人在不同客户的地址不能互相替代</div>
      <div class="wset">${recips.map((r,i)=>`<div class="wopt ${i===shareTo?'on':''}" onclick="pickTo(${i})"><i></i>
        <div class="b">${r.name}${r.email?' · '+r.email:''}${idTag(r)}${dTag(r)}<div class="d">${r.role}</div></div></div>`).join('')}</div>
      ${gate}
      <div class="mlab">邮件 · 附上当前 ${cur.v}</div>
      <div class="mail" contenteditable>${draft}</div>
      <span class="file">${f.type.toUpperCase()} · ${f.name} · ${f.size}</span>
      <div class="mlab">记在哪件工作里</div>
      <div class="wset"><div class="wopt on"><i></i><div class="b">${work}<div class="d">发送这一封，不会生成公开链接</div></div></div></div>
      ${f.origin!=='deliverable'?'<div class="call">这是你上传的输入资料，还不是成果。发出去的是原件。</div>':''}
      ${/草稿|未完成/.test((f.usedBy[0]||{}).role||'')?'<div class="call">当前版本尚未核验完成，发出去会按草稿交付。</div>':''}
      <div class="mlab">发送前</div>
      <ul class="imp">
        <li><i style="color:var(--green)">✓</i>从 ${from.email} 发出，对方看到的是${from.ident}</li>
        <li><i style="color:var(--${canSend?'green':'amber'})">${canSend?'✓':'!'}</i>${canSend?`只发给 ${to.name} · ${to.email}，身份已验证且来源允许披露`:`还不能发送：${to&&!to.verified?'先在上面确认身份':'身份已验证，还需要来源允许披露'}`}</li>
        <li><i style="color:var(--green)">✓</i>固定 ${cur.v}，之后的修改不会自动同步</li>
        ${fit?'':`<li><i style="color:var(--rose)">✕</i>不会默认改回「${(boxes.find(m=>m.fit(f.context))||{}).title||'常用发件账号'}」，批准即按 ${from.email} 发送</li>`}
        <li><i style="color:var(--amber)">!</i>对方已下载的副本无法收回</li>
        <li><i style="color:var(--rose)">✕</i>不会顺带生成公开链接，也不会使用自动提醒规则</li>
      </ul>`;
    const why = !to ? '先选定收件人' : !to.verified ? `先确认「${to.name}」是谁` : to.disclose!=='allowed' ? `来源尚未允许向${to.name}披露` : `需要你批准这一封 · ${from.email}`;
    acts = `<span class="note">${why}</span><button class="gb" onclick="closeModal()">取消</button>
      <button class="pb" ${canSend?'':'disabled style="opacity:.4"'} onclick="closeModal()">批准发送 1 封</button>`;
  }

  if(shareMode==='private'){
    body = `<div class="mlab">请注意</div><ul class="imp">
      <li><i style="color:var(--green)">✓</i>只有你登录后可以打开 ${cur.v}</li>
      <li><i style="color:var(--rose)">✕</i>不能当作发给客户的链接，对方打不开</li>
      <li><i>·</i>适合发给自己，或在聊天中引用</li></ul>`;
    acts = `<button class="gb" onclick="closeModal()">取消</button><button class="pb" onclick="closeModal()">生成私有链接</button>`;
  }

  if(shareMode==='public'){
    body = `<div class="call">这不是发给指定客户。任何拿到链接的人都能查看 ${cur.v}，顾问交付请用「发给指定客户」。</div>
      <div class="mlab">请注意</div><ul class="imp">
        <li><i style="color:var(--amber)">!</i>最长 48 小时后自动失效，可随时撤销源站访问</li>
        <li><i style="color:var(--amber)">!</i>公开的是现在的 ${cur.v}，之后的修改不会自动同步</li>
        <li><i style="color:var(--rose)">✕</i>对方已下载的副本无法收回</li></ul>`;
    acts = `<span class="note">公开链接需单独批准</span><button class="gb" onclick="closeModal()">取消</button><button class="pb" onclick="closeModal()">生成公开链接</button>`;
  }

  show(`<h3>分享「${f.name}」</h3><div class="ms">当前版本 ${cur.v} · ${cur.date}${f.context?' · '+f.context:''}</div>
    <div class="opts">
      ${opt('send', client?'发给指定客户':'发给指定的人', hasReady?'选定收件人，邮件附上这个版本':'在这次发送里确认身份和披露')}
      ${opt('private','私有链接','只有你登录后可以打开')}
      ${opt('public','临时公开链接','任何拿到链接的人可查看，最长 48 小时')}
    </div>${body}<div class="acts">${acts}</div>`, true);
}
function openDelete(){
  const f = files.find(x=>x.id===sel);
  show(`<h3>把「${f.name}」移到回收站？</h3><div class="ms">30 天内可以恢复，之后永久删除。</div>
    ${f.versions.length>1?`<div class="opts"><div class="opt on" onclick="pickOpt(this)"><b>整个文件（${f.versions.length} 个版本）</b></div><div class="opt" onclick="pickOpt(this)"><b>只删除当前版本</b><span>不会自动切回旧版本，需要你手动选择</span></div></div>`:''}
    <div class="mlab">影响</div><ul class="imp">
      ${f.share&&f.share.mode==='public'?`<li><i style="color:var(--rose)">✕</i>公开链接立即失效</li>`:''}
      ${f.usedBy.map(u=>`<li><i style="color:var(--amber)">!</i>「${u.work}」中会显示该${u.role.includes('输入')?'资料':'成果'}不可用</li>`).join('')}
      <li><i style="color:var(--green)">✓</i>不会删除或结束任何工作</li></ul>
    <div class="acts"><button class="gb" onclick="closeModal()">取消</button><button class="pb danger" onclick="closeModal()">移到回收站</button></div>`);
}
function openPurge(){
  const f = files.find(x=>x.id===sel);
  show(`<h3>永久删除「${f.name}」？</h3><div class="ms">删除后无法恢复。</div>
    <div class="acts"><button class="gb" onclick="closeModal()">取消</button><button class="pb danger" onclick="closeModal()">永久删除</button></div>`);
}
function openUpload(){
  show(`<h3>上传资料</h3><div class="ms">上传的文件作为输入资料，需要时在聊天中说明用途。</div>
    <div class="drop"><b>拖入文件或点击选择</b>文件夹请先压缩为 ZIP</div>
    <div class="limits"><div>文档、表格等<span> · 25 MB 以内</span></div><div>视频<span> · 100 MB 以内</span></div>
      <div>音频<span> · 250 MB / 120 分钟以内</span></div><div>粘贴图片<span> · 8 MB 以内</span></div></div>
    <ul class="imp" style="margin-top:14px"><li><i>·</i>上传的文件不会被执行，压缩包只会被安全解压</li><li><i>·</i>原件始终保留，处理后的版本不会覆盖原件</li></ul>
    <div class="acts"><button class="gb" onclick="closeModal()">取消</button><button class="pb" onclick="closeModal()">选择文件</button></div>`);
}

document.addEventListener('click',e=>{ const m=document.getElementById('more'); if(m && !m.contains(e.target)) m.classList.remove('open'); });
document.getElementById('q').addEventListener('input', renderList);
renderList(); renderDetail();
</script>
</body>
</html>
