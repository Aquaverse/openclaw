name: Design
description: 设计规格与工程交接
title: '[Design] '
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: >-
        GitHub 是权威记录。正式评论使用
        [AI-PLAN]、[AI-QUESTION]、[AI-EVIDENCE]、[AI-BLOCKED]、[HUMAN-DECISION]、[AI-RESULT]。需求变更须同步
        Issue 和引用文件。
  - type: dropdown
    id: type
    attributes:
      label: Type
      description: 本表单对应的任务类型。
      options:
        - Design
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: 描述当前问题、影响与证据，不以解决方案代替问题。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: User Outcome
      description: 用户完成后得到什么？
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: 列出本次包含的工作。
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: 明确边界；无则填写 None。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: 每条使用 AC-1、AC-2 等编号，给出输入、预期结果和可自动验证的方法。
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: 填写仓库中的 PRD / Spec / Design / API / ADR 链接；ADR 使用 docs/adr/。无则说明原因。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: '关联 Issue/API/服务；阻塞项写 Blocked by: #编号，无则填写 None。'
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      description: 综合数据、安全、兼容性和回滚风险。
      options:
        - low
        - medium
        - high
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
      description: 最终监督 AI 并负责验收的人，填写 @GitHub用户名。
    validations:
      required: true
  - type: dropdown
    id: ai_ready
    attributes:
      label: AI Ready
      description: 仅在需求、验收条件与依赖明确且无影响行为的 TBD 时选择 Yes；No 时不得实施。
      options:
        - 'No'
        - 'Yes'
    validations:
      required: true
  - type: textarea
    id: flow
    attributes:
      label: User Flow
      description: 主流程、分支流程与导航关系。
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: Target Platforms
      description: Web/mobile 差异、响应式断点、OS/设备约束。
    validations:
      required: true
  - type: textarea
    id: components
    attributes:
      label: Component Constraints
      description: 设计系统、可复用组件和可访问性要求。
    validations:
      required: true
  - type: textarea
    id: states
    attributes:
      label: UI States
      description: 分别说明 loading / empty / error / permission 状态。
    validations:
      required: true
  - type: textarea
    id: handoff
    attributes:
      label: Design Handoff
      description: >-
        填写 docs/design/<issue>/ 中 design-spec.md、states.md、assets/、handoff/ 的 GitHub 链接；完成后评论
        [AI-RESULT] design-ready。
    validations:
      required: true
