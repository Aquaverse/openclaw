<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 570" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Actions 工作流关系</title>
  <desc id="desc">同仓库非草稿 PR 经过 OpenClaw CI、openclaw/ci-gate、Codex QA、Codex Review 和 Merge gate，随后由 Quality Ledger 发布质量记录。main push 和手动运行只执行 OpenClaw CI。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#53616b"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202b33; }
      .node { fill: #fff; stroke: #53616b; stroke-width: 1.5; rx: 7; }
      .source { fill: #edf4f6; stroke: #48717d; }
      .check { fill: #f1f5e9; stroke: #71864c; }
      .publish { fill: #f8f1e8; stroke: #9b7042; }
      .edge { fill: none; stroke: #53616b; stroke-width: 1.7; marker-end: url(#arrow); }
      .title { font-size: 14px; font-weight: 600; text-anchor: middle; }
      .lane { font-size: 16px; font-weight: 700; }
    </style>
  </defs>

  <text class="lane" x="30" y="30">Pull request</text>
  <path class="edge" d="M190 75H225"/>
  <path class="edge" d="M385 75H420"/>
  <path class="edge" d="M590 75H625"/>
  <path class="edge" d="M755 75H790"/>
  <path class="edge" d="M930 75H965"/>
  <path class="edge" d="M1095 75H1120"/>
  <rect class="node source" x="30" y="48" width="160" height="54"/>
  <text class="title" x="110" y="71"><tspan x="110">同仓库、非草稿</tspan><tspan x="110" dy="18">PR</tspan></text>
  <rect class="node check" x="225" y="48" width="160" height="54"/>
  <text class="title" x="305" y="71"><tspan x="305">OpenClaw</tspan><tspan x="305" dy="18">CI lanes</tspan></text>
  <rect class="node check" x="420" y="48" width="170" height="54"/>
  <text class="title" x="505" y="80">openclaw/ci-gate</text>
  <rect class="node check" x="625" y="48" width="130" height="54"/>
  <text class="title" x="690" y="80">Codex QA</text>
  <rect class="node check" x="790" y="48" width="140" height="54"/>
  <text class="title" x="860" y="80">Codex Review</text>
  <rect class="node check" x="965" y="48" width="130" height="54"/>
  <text class="title" x="1030" y="80">Merge gate</text>
  <rect class="node" x="1120" y="48" width="90" height="54"/>
  <text class="title" x="1165" y="80">CI 完成</text>

  <path class="edge" d="M1165 102V165H905V205"/>
  <rect class="node publish" x="810" y="205" width="190" height="54"/>
  <text class="title" x="905" y="237">Quality Ledger</text>
  <path class="edge" d="M905 259V315H230V355"/>
  <path class="edge" d="M905 259V355"/>
  <path class="edge" d="M905 315H1120V355"/>
  <rect class="node publish" x="100" y="355" width="260" height="54"/>
  <text class="title" x="230" y="387">更新 PR 评论</text>
  <rect class="node publish" x="775" y="355" width="260" height="54"/>
  <text class="title" x="905" y="387">为 QA 缺陷创建 Issue</text>
  <rect class="node publish" x="1070" y="355" width="140" height="54"/>
  <text class="title" x="1140" y="378"><tspan x="1140">质量记录</tspan><tspan x="1140" dy="18">PR</tspan></text>

  <text class="lane" x="30" y="470">main push / manual dispatch</text>
  <path class="edge" d="M220 515H285"/>
  <path class="edge" d="M445 515H510"/>
  <path class="edge" d="M680 515H745"/>
  <rect class="node source" x="30" y="488" width="190" height="54"/>
  <text class="title" x="125" y="511"><tspan x="125">push main</tspan><tspan x="125" dy="18">或手动运行</tspan></text>
  <rect class="node check" x="285" y="488" width="160" height="54"/>
  <text class="title" x="365" y="511"><tspan x="365">OpenClaw</tspan><tspan x="365" dy="18">CI lanes</tspan></text>
  <rect class="node check" x="510" y="488" width="170" height="54"/>
  <text class="title" x="595" y="520">openclaw/ci-gate</text>
  <rect class="node" x="745" y="488" width="220" height="54"/>
  <text class="title" x="855" y="511"><tspan x="855">CI 完成</tspan><tspan x="855" dy="18">不发布 Ledger</tspan></text>
</svg>
