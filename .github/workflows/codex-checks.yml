name: Codex checks

on:
  pull_request:
    branches: [codex-ci]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  qa:
    name: Codex QA
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/codex-qa.yml
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  review:
    name: Codex Review
    needs: qa
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/codex-review.yml
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
